name = "lectures-on-the-hyperreals"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LecturesOnTheHyperreals"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "v4.35.0"

[[lean_lib]]
name = "LecturesOnTheHyperreals"

[[lean_lib]]
name = "Book"

[[lean_exe]]
name = "generate-book"
root = "BookMain"
supportInterpreter = true
